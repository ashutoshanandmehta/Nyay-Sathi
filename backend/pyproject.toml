[project]
name = "nyay-saathi-backend"
version = "0.1.0"
description = "Persistent conversational legal-information assistant for India"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.33",
  "langchain==1.4.9",
  "langchain-openai==1.7.4",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "chromadb==1.5.9",
  "rank-bm25==0.2.2",
  "openai==3.45.0",
  "httpx==0.28.1",
  "PyMuPDF==1.26.7",
  "pytesseract==0.3.13",
  "Pillow==12.0.0",
  "python-docx==1.2.0",
  "reportlab==4.4.4",
  "markdown-it-py==4.0.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.14.3",
  "mypy==1.18.2",
  "pypdf==6.4.0",
  "pdf2image==1.17.0",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
